<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Organisation Analytics | Hamlet</title>
<script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script><script defer src="/firebase-config.js"></script>
<style>body{margin:0;background:#0b1120;color:#f3f6fb;font:15px Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:32px 20px}a{color:#93c5fd}.muted{color:#a8b6ca;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:24px 0}.card{padding:20px;border:1px solid #2b3c55;border-radius:12px;background:#111827}.label{color:#a8b6ca;font-size:12px}.value{font-size:30px;font-weight:700;margin-top:8px}.bar{display:flex;align-items:center;gap:10px;margin:12px 0}.bar span:first-child{width:190px}.track{height:9px;flex:1;background:#26354b;border-radius:9px;overflow:hidden}.fill{height:100%;background:#60a5fa}.status{padding:14px;border:1px solid #40516a;border-radius:9px}</style>
</head>
<body><main class="wrap"><a href="/app/hamlet/organisations.html">← Organisation workspace</a><h1 id="title">Organisation analytics</h1><p class="muted">Aggregate counts only. Deal values, names, clients and property details are not included.</p><div id="status" class="status">Loading organisation analytics…</div><section id="results" hidden><div class="grid" id="summary"></div><h2>Deal pipeline</h2><div id="stages"></div><h2>Property portfolio</h2><div id="types"></div></section></main>
<script>(function(){'use strict';const $=id=>document.getElementById(id);const stages=['Initial Inspection','LOI Issued','Due Diligence','Under Contract','Lease Execution','Closing','Commission Payout','Closed'];function bars(root,values,labels){const max=Math.max(1,...labels.map(label=>values[label]||0));root.replaceChildren();labels.forEach(label=>{const row=document.createElement('div');row.className='bar';const name=document.createElement('span');name.textContent=label;const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=((values[label]||0)/max*100)+'%';track.append(fill);const count=document.createElement('strong');count.textContent=String(values[label]||0);row.append(name,track,count);root.append(row);});}async function start(){try{if(!window.firebase||!window.firebaseConfig)throw Error('Firebase is unavailable.');if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();auth.onAuthStateChanged(async user=>{if(!user){location.replace('/login.html?next='+encodeURIComponent(location.pathname));return}try{await user.reload();await user.getIdToken(true);if(!user.emailVerified)throw Error('Verify your email address to continue.');const memberships=await db.collection('organisationMembers').where('uid','==',user.uid).get();const active=memberships.docs.map(doc=>doc.data()).filter(member=>member.status==='active'&&['owner','admin'].includes(member.role));const preferred=sessionStorage.getItem('hamletActiveOrganisationId');const membership=active.find(item=>item.organisationId===preferred)||active[0];if(!membership)throw Error('Analytics are available to organisation owners and administrators.');const data=(await firebase.app().functions('us-central1').httpsCallable('getOrganisationAnalytics')({organisationId:membership.organisationId})).data;const org=await db.collection('organisations').doc(membership.organisationId).get();$('title').textContent=(org.exists?org.data().name+' — ':'')+'Organisation analytics';const summary=[['Active members',data.members],['Active teams',data.teams],['Organisation deals',data.deals],['Organisation properties',data.properties]];$('summary').replaceChildren();summary.forEach(([label,value])=>{const card=document.createElement('article');card.className='card';const name=document.createElement('div');name.className='label';name.textContent=label;const count=document.createElement('div');count.className='value';count.textContent=String(value);card.append(name,count);$('summary').append(card)});bars($('stages'),data.dealsByStage||{},stages);bars($('types'),data.propertiesByType||{},['Commercial','Residential']);$('status').hidden=true;$('results').hidden=false;}catch(error){$('status').textContent=error.message||'Could not load analytics.';}});}catch(error){$('status').textContent=error.message||'Could not initialise analytics.';}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();})();</script></body></html>
