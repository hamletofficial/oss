<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Hamlet Connect logo</title>
  <desc id="desc">Hamlet's h symbol precisely centred within a circular communication orbit.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="720" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#073ca8"/>
      <stop offset="0.55" stop-color="#082b96"/>
      <stop offset="1" stop-color="#061b5f"/>
    </linearGradient>
    <linearGradient id="orbit" x1="170" y1="160" x2="650" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1767ff"/>
      <stop offset="0.52" stop-color="#25d1ed"/>
      <stop offset="1" stop-color="#1767ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#1bcbe8" stop-opacity=".15"/>
      <stop offset="1" stop-color="#1bcbe8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" rx="160" fill="url(#background)"/>
  <rect width="800" height="800" rx="160" fill="url(#glow)"/>
  <rect x="8" y="8" width="784" height="784" rx="152" fill="none" stroke="#55ddf6" stroke-opacity=".16" stroke-width="16"/>

  <circle cx="400" cy="344" r="224" fill="none" stroke="url(#orbit)" stroke-width="34" stroke-linecap="round" stroke-dasharray="1020 290" stroke-dashoffset="-70" transform="rotate(-32 400 344)"/>

  <!-- The glyph's visual bounds are centred at (400, 344) inside the orbit. -->
  <path d="M325 197H380V284C397 261 424 249 457 249C512 249 545 287 545 348V461H488V363C488 327 471 307 441 307C402 307 380 332 380 375V461H325Z" fill="#fff"/>

  <circle cx="621" cy="408" r="38" fill="#082b96" stroke="#25d1ed" stroke-width="14"/>
  <circle cx="621" cy="408" r="10" fill="#fff"/>
  <circle cx="172" cy="498" r="28" fill="#082b96" stroke="#1767ff" stroke-width="12"/>
  <circle cx="172" cy="498" r="8" fill="#fff"/>
  <path d="M196 485C234 448 246 405 232 354" fill="none" stroke="#1767ff" stroke-width="12" stroke-linecap="round" opacity=".72"/>

  <text x="400" y="665" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="700" letter-spacing="-3">hamlet</text>
  <text x="400" y="724" text-anchor="middle" fill="#69dced" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="10">CONNECT</text>
</svg>
