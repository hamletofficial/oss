  <path d="M278 174H352V290C374 260 410 245 454 245C527 245 570 296 570 378V530H494V397C494 348 471 320 431 320C379 320 352 354 352 412V530H278Z" fill="#fff" transform="translate(96 82) scale(.76)"/>

