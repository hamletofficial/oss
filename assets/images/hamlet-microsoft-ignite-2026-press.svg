<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
<title id="title">Hamlet to attend Microsoft Ignite 2026 virtually</title>
<desc id="desc">Technology-themed press artwork with Microsoft and Hamlet branding, online attendance, and conference dates November 17 to 20, 2026.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061638"/><stop offset=".55" stop-color="#0b1d50"/><stop offset="1" stop-color="#090e26"/></linearGradient>
 <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#05c9f2"/><stop offset=".55" stop-color="#655bff"/><stop offset="1" stop-color="#cf43ff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#168dff" stop-opacity=".7"/><stop offset="1" stop-color="#168dff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
 <filter id="neon"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="1600" fill="url(#bg)"/>
<circle cx="1260" cy="420" r="490" fill="url(#glow)" opacity=".8"/>
<circle cx="1340" cy="380" r="270" fill="none" stroke="#1ebfff" stroke-width="2" opacity=".4"/>
<circle cx="1340" cy="380" r="220" fill="none" stroke="#7162ff" stroke-width="2" opacity=".38"/>
<g fill="none" stroke="#4ccfff" opacity=".65">
 <path d="M1010 250L1200 130 1390 220 1510 410 1340 580 1110 500 1010 250Z"/>
 <path d="M1110 500L1200 130M1390 220L1340 580M1010 250L1510 410"/>
</g>
<g fill="#8ceaff" filter="url(#neon)"><circle cx="1010" cy="250" r="7"/><circle cx="1200" cy="130" r="7"/><circle cx="1390" cy="220" r="7"/><circle cx="1510" cy="410" r="7"/><circle cx="1340" cy="580" r="7"/></g>
<path d="M0 1050 C300 850 470 1220 760 1030 S1270 850 1600 1040" fill="none" stroke="url(#wave)" stroke-width="5" opacity=".8" filter="url(#neon)"/>
<path d="M0 1120 C300 930 470 1300 760 1110 S1270 930 1600 1120" fill="none" stroke="url(#wave)" stroke-width="2" opacity=".55"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#f8fbff">
 <text x="90" y="125" font-size="72" font-weight="700" letter-spacing="-3">hamlet</text>
 <path d="M375 60V145" stroke="#e8f5ff" stroke-width="2" opacity=".8"/>
 <g transform="translate(430 65)">
  <rect width="35" height="35" fill="#f25022"/><rect x="43" width="35" height="35" fill="#7fba00"/>
  <rect y="43" width="35" height="35" fill="#00a4ef"/><rect x="43" y="43" width="35" height="35" fill="#ffb900"/>
  <text x="98" y="61" font-size="55" font-weight="500">Microsoft</text>
 </g>
 <text x="90" y="235" font-size="28" letter-spacing="12" fill="#9eeaff" font-weight="700">PRESS RELEASE</text>
 <text x="90" y="375" font-size="116" font-weight="800" letter-spacing="-5">MICROSOFT</text>
 <text x="90" y="495" font-size="116" font-weight="800" letter-spacing="-5">IGNITE <tspan fill="#20d7f4">2026</tspan></text>
 <text x="95" y="600" font-size="58" font-weight="700">HAMLET TO ATTEND</text>
 <text x="95" y="680" font-size="82" font-weight="900" fill="#20d7f4" letter-spacing="2">VIRTUALLY</text>
 <text x="95" y="790" font-size="36" fill="#dceaff">Fresh off GitHub Universe, and newly onboarded</text>
 <text x="95" y="842" font-size="36" fill="#dceaff">as a Microsoft Azure Artifact Signing client,</text>
 <text x="95" y="894" font-size="36" fill="#dceaff">the Hamlet team will join Ignite online.</text>
</g>
<g transform="translate(790 950)">
 <rect width="650" height="360" rx="28" fill="#070d24" stroke="#49bfff" stroke-width="5" filter="url(#neon)"/>
 <rect x="28" y="28" width="594" height="270" rx="15" fill="#111d55"/>
 <g transform="translate(210 90)">
  <rect width="38" height="38" fill="#f25022"/><rect x="46" width="38" height="38" fill="#7fba00"/>
  <rect y="46" width="38" height="38" fill="#00a4ef"/><rect x="46" y="46" width="38" height="38" fill="#ffb900"/>
  <text x="110" y="34" font-family="Segoe UI,Arial" font-size="37" fill="#fff">Microsoft</text>
  <text x="110" y="82" font-family="Segoe UI,Arial" font-size="42" font-weight="700" fill="#fff">Ignite <tspan fill="#22d8f4">2026</tspan></text>
 </g>
 <rect x="180" y="220" width="290" height="58" rx="28" fill="none" stroke="#20d7f4" stroke-width="4"/>
 <circle cx="220" cy="249" r="10" fill="#20d7f4"/><path d="M235 239L257 225V273L235 259Z" fill="#20d7f4"/>
 <text x="278" y="261" font-family="Segoe UI,Arial" font-size="34" font-weight="800" fill="#fff">ONLINE</text>
 <path d="M-70 360H720L650 390H0Z" fill="#193b75" stroke="#52caff" stroke-width="3"/>
</g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#fff">
 <text x="95" y="1370" font-size="60" font-weight="800" fill="#20d7f4">NOVEMBER 17–20, 2026</text>
 <text x="95" y="1435" font-size="31" fill="#d8eaff">A four-day technology conference showcased by Microsoft in San Francisco.</text>
 <path d="M95 1480H1500" stroke="#a8dfff" stroke-width="2" opacity=".75"/>
 <text x="95" y="1540" font-size="25" letter-spacing="6" fill="#a8eaff">SAN FRANCISCO  •  ONLINE ATTENDANCE</text>
