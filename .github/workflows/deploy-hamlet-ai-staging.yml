name: Deploy Hamlet AI Worker to staging

on:
  push:
    branches:
      - feature/commercial-certifications-epc
    paths:
      - "worker/hamlet-ai/**"
      - ".github/workflows/deploy-hamlet-ai-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamlet-ai-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/feature/commercial-certifications-epc'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker/hamlet-ai
    steps:
      - name: Check out EPC feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/commercial-certifications-epc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/hamlet-ai/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate staging Worker bundle
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy only hamlet-ai-gateway-staging
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
