name: Hamlet CRM smoke and security tests

on:
  push:
    branches: [main]
    paths:
      - 'app/hamlet/index.html'
      - 'organisations.html'
      - 'organisation-directory.html'
      - 'app/hamlet/organisations.html'
      - 'app/hamlet/organisation-files.html'
      - 'app/hamlet/organisation-association.html'
      - 'app/hamlet/organisation-activity.html'
      - 'app/hamlet/organisation-analytics.html'
      - 'app/hamlet/organisation-verification-admin.html'
      - 'worker/hamlet-organisations-router/**'
      - 'firestore.indexes.json'
      - 'messages.html'
      - 'functions/index.js'
      - 'functions/hamlet-organisation-audit.js'
      - 'app/hamlet/organisation-activity.html'
      - 'app/hamlet/organisation-analytics.html'
      - 'app/hamlet/organisation-verification-admin.html'
      - 'app/hamlet/organisation-deals.html'
      - 'app/hamlet/organisation-properties.html'
      - 'functions/hamlet-organisations.js'
      - 'functions/package.json'
      - 'functions/test/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'site-search.js'
      - 'search-index.json'
      - 'tests/**'
      - '.github/workflows/hamlet-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/hamlet/index.html'
      - 'organisations.html'
      - 'organisation-directory.html'
      - 'app/hamlet/organisations.html'
      - 'app/hamlet/organisation-files.html'
      - 'app/hamlet/organisation-association.html'
      - 'app/hamlet/organisation-activity.html'
      - 'app/hamlet/organisation-analytics.html'
      - 'worker/hamlet-organisations-router/**'
      - 'firestore.indexes.json'
      - 'messages.html'
      - 'functions/index.js'
      - 'functions/hamlet-organisations.js'
      - 'functions/hamlet-organisation-audit.js'
      - 'functions/package.json'
      - 'functions/test/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'site-search.js'
      - 'search-index.json'
      - 'tests/**'
      - '.github/workflows/hamlet-smoke.yml'

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse client and Cloud Function JavaScript
        run: node --test tests/hamlet-static.test.cjs

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise Hamlet deal, saved-search and document flows
        run: node --test tests/hamlet-browser.test.cjs

  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase test dependencies
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-tools firebase @firebase/rules-unit-testing
      - name: Test Firestore and Storage rules in emulators
        run: npx firebase-tools emulators:exec --only firestore,storage --project demo-hamlet-functions "node --test tests/hamlet-rules.test.cjs"

  organisation-callables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI and Functions dependencies
        run: |
          npm install --no-save --ignore-scripts --package-lock=false firebase-tools
          npm install --prefix functions --no-save --ignore-scripts --no-package-lock
      - name: Exercise organisation callable operations against Firestore Emulator
        run: npx firebase-tools emulators:exec --only firestore --project demo-hamlet-functions "npm --prefix functions run test:organisations"
