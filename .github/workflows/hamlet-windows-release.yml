name: Build, sign and publish Hamlet v1.04.08 for Windows

on:
  pull_request:
    branches:
      - main
    paths:
      - "desktop/hamlet-windows/**"
      - ".github/workflows/hamlet-windows-release.yml"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish when explicitly enabled"
        required: true
        default: "v1.04.08"
        type: string
      sign_installer:
        description: "Run Azure Artifact Signing after the build succeeds"
        required: true
        default: false
        type: boolean
      publish_release:
        description: "Publish the signed installer as a public GitHub release"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "desktop/hamlet-windows/**"
      - ".github/workflows/hamlet-windows-release.yml"

permissions:
  contents: read

concurrency:
  group: hamlet-v1-04-08-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test Windows installer
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install desktop dependencies
        working-directory: desktop/hamlet-windows
        run: npm install

      - name: Run desktop syntax, security and unit tests
        working-directory: desktop/hamlet-windows
        run: npm run check

      - name: Verify unified version number
        working-directory: desktop/hamlet-windows
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($version -ne "1.4.8") {
            throw "Expected Windows package version 1.4.8, found $version."
          }

      - name: Build Windows x64 installer
        working-directory: desktop/hamlet-windows
        run: npm run pack:win

      - name: Validate unsigned installer output
        shell: pwsh
        working-directory: desktop/hamlet-windows
        run: |
          $installers = @(Get-ChildItem -Path "release" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer; found $($installers.Count)."
          }
          $installer = $installers[0]
          if ($installer.Name -ne "hamlet-Setup-1.4.8.exe") {
            throw "Unexpected installer filename: $($installer.Name)"
          }
          if ($installer.Length -lt 1MB) {
            throw "Installer is unexpectedly small ($($installer.Length) bytes); refusing to continue."
          }
          Write-Host "Installer ready for signing: $($installer.FullName)"

      - name: Retain unsigned build for signing job
        uses: actions/upload-artifact@v4
        with:
          name: hamlet-windows-v1.04.08-unsigned
          path: desktop/hamlet-windows/release/hamlet-Setup-1.4.8.exe
          if-no-files-found: error
          retention-days: 2

  sign-and-publish:
    name: Sign and optionally publish Windows installer
    needs: build-and-test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sign_installer)
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download unsigned installer
        uses: actions/download-artifact@v4
        with:
          name: hamlet-windows-v1.04.08-unsigned
          path: desktop/hamlet-windows/release

      - name: Log in to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer with Microsoft Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\desktop\hamlet-windows\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Authenticode signature and calculate SHA-256
        shell: pwsh
        working-directory: desktop/hamlet-windows
        run: |
          $installer = Get-Item "release/hamlet-Setup-1.4.8.exe"
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Installer Authenticode signature is not valid: $($signature.Status) — $($signature.StatusMessage)"
          }
          if (-not $signature.SignerCertificate) {
            throw "Signed installer has no signer certificate."
          }
          if ($signature.SignerCertificate.Subject -notmatch "Impact in Business Recruitment Group Limited") {
            throw "Unexpected signing certificate subject: $($signature.SignerCertificate.Subject)"
          }
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          Write-Host "Thumbprint: $($signature.SignerCertificate.Thumbprint)"
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content -Path "release/SHA256SUMS.txt" -Encoding ascii
          $checksumLine = (Get-Content -Path "release/SHA256SUMS.txt" -Raw).Trim()
          if ($checksumLine -notmatch '^[A-Fa-f0-9]{64}  hamlet-Setup-1\.4\.6\.exe$') {
            throw "Checksum file does not match the required SHA-256 format."
          }
          if ($checksumLine.Substring(0, 64).ToUpperInvariant() -ne $hash) {
            throw "Checksum file hash does not match the signed installer."
          }
          Write-Host "SHA-256: $hash"

      - name: Retain verified signed installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: hamlet-windows-v1.04.08-signed
          path: |
            desktop/hamlet-windows/release/hamlet-Setup-1.4.8.exe
            desktop/hamlet-windows/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Hamlet v1.04.08 Windows release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Hamlet v1.04.08 — Windows (Signed)
          body_path: desktop/hamlet-windows/RELEASE-NOTES.md
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            desktop/hamlet-windows/release/hamlet-Setup-1.4.8.exe
            desktop/hamlet-windows/release/SHA256SUMS.txt
