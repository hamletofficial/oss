name: Build, sign and publish Hamlet v1.04.06 for Windows

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build and publish"
        required: true
        default: "v1.04.06"
        type: string
  push:
    branches:
      - main
    paths:
      - "desktop/hamlet-windows/**"
      - ".github/workflows/hamlet-windows-release.yml"
    tags:
      - "v1.04.06"

permissions:
  contents: write
  id-token: write

concurrency:
  group: hamlet-v1-04-06-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-sign-and-publish:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install desktop dependencies
        working-directory: desktop/hamlet-windows
        run: npm install

      - name: Run desktop syntax, security and unit tests
        working-directory: desktop/hamlet-windows
        run: npm run check

      - name: Verify unified version number
        working-directory: desktop/hamlet-windows
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($version -ne "1.4.6") {
            throw "Expected Windows package version 1.4.6, found $version."
          }

      - name: Build Windows x64 installer
        working-directory: desktop/hamlet-windows
        run: npm run pack:win

      - name: Validate unsigned installer output
        shell: pwsh
        working-directory: desktop/hamlet-windows
        run: |
          $installers = @(Get-ChildItem -Path "release" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer; found $($installers.Count)."
          }
          $installer = $installers[0]
          if ($installer.Name -ne "hamlet-Setup-1.4.6.exe") {
            throw "Unexpected installer filename: $($installer.Name)"
          }
          if ($installer.Length -lt 1MB) {
            throw "Installer is unexpectedly small ($($installer.Length) bytes); refusing to publish."
          }
          Write-Host "Installer ready for signing: $($installer.FullName)"

      # Requires GitHub Actions secrets/variables configured for the Azure
      # Artifact Signing account and an Entra app using workload identity federation.
      - name: Sign installer with Microsoft Artifact Signing
        uses: Azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\desktop\hamlet-windows\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: https://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          exclude-workload-identity-credential: false

      - name: Verify Authenticode signature and calculate SHA-256
        shell: pwsh
        working-directory: desktop/hamlet-windows
        run: |
          $installer = Get-Item "release/hamlet-Setup-1.4.6.exe"
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Installer Authenticode signature is not valid: $($signature.Status) — $($signature.StatusMessage)"
          }
          if (-not $signature.SignerCertificate) {
            throw "Signed installer has no signer certificate."
          }
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          Write-Host "Thumbprint: $($signature.SignerCertificate.Thumbprint)"
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content -Path "release/SHA256SUMS.txt" -Encoding ascii
          $checksumLine = (Get-Content -Path "release/SHA256SUMS.txt" -Raw).Trim()
          if ($checksumLine -notmatch '^[A-Fa-f0-9]{64}  hamlet-Setup-1\.4\.6\.exe$') {
            throw "Checksum file does not match the required SHA-256 format."
          }
          if ($checksumLine.Substring(0, 64).ToUpperInvariant() -ne $hash) {
            throw "Checksum file hash does not match the signed installer."
          }
          Write-Host "SHA-256: $hash"

      - name: Retain verified signed installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: hamlet-windows-v1.04.06-signed
          path: |
            desktop/hamlet-windows/release/hamlet-Setup-1.4.6.exe
            desktop/hamlet-windows/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Hamlet v1.04.06 Windows release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v1.04.06')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Hamlet v1.04.06 — Windows (Signed)
          body_path: desktop/hamlet-windows/RELEASE-NOTES.md
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            desktop/hamlet-windows/release/hamlet-Setup-1.4.6.exe
            desktop/hamlet-windows/release/SHA256SUMS.txt
