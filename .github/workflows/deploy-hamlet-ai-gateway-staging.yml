name: Deploy Hamlet AI Gateway Staging

on:
  workflow_dispatch:
  push:
    paths:
      - "worker/hamlet-ai/**"
      - ".github/workflows/deploy-hamlet-ai-gateway-staging.yml"

permissions:
  contents: read

concurrency:
  group: hamlet-ai-gateway-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: worker/hamlet-ai
        run: npm install

      - name: Deploy staging Worker
        working-directory: worker/hamlet-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN repository secret is not configured."
            exit 1
          fi
          npx wrangler deploy --config wrangler.toml

      - name: Verify route registration and authentication gate
        run: |
          set -e
          for route in domestic-epc-search domestic-epc-certificate; do
            status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
              -X POST "https://hamlet-ai-gateway-staging.<ACCOUNT_SUBDOMAIN>.workers.dev/v1/$route" \
              -H "Content-Type: application/json" -d '{}')
            echo "$route returned HTTP $status"
            if [ "$status" != "401" ]; then
              cat /tmp/response.json
              echo "Expected 401 authentication gate; route may not be registered or auth behavior changed."
              exit 1
            fi
          done
