name: Deploy Hamlet AI Gateway Staging

on:
  workflow_dispatch:
  push:
    paths:
      - "worker/hamlet-ai/**"
      - ".github/workflows/deploy-hamlet-ai-gateway-staging.yml"

permissions:
  contents: read

concurrency:
  group: hamlet-ai-gateway-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: worker/hamlet-ai
        run: npm install

      - name: Deploy staging Worker
        working-directory: worker/hamlet-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN repository secret is not configured."
            exit 1
          fi
          npx wrangler deploy --config wrangler.toml

